<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Escolha um número entre 1 e 100. Cada número gera uma figura diferente, assinada com o seu e-mail.</p>
    </header>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">



      <button type="submit">Desenhar</button>
    </form>
<!-- 1. Configuração invisível do Google Identity Services -->
<div id="g_id_onload"
     data-client_id="632204451697-qq0pc2mljaa56e7u0pbdm97c316tis0e.apps.googleusercontent.com"
     data-callback="tratarLoginGoogle"
     data-auto_prompt="false">
</div>

<!-- 2. O botão visual "Sign in with Google" -->
<div class="g_id_signin"
     data-type="standard"
     data-size="large"
     data-theme="outline"
     data-text="sign_in_with"
     data-shape="rectangular"
     data-logo_alignment="left">
</div>
    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
